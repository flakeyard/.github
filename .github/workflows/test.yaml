# CI of this repository: the tests of the scripts of org/, then
# workflow-check, which checks pull request titles, renovate.json and its preset
# tag, and builds the checks of the root flake, which only imports atoms.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  # Weekly, for the end of life of the nixpkgs branch in flake.lock (FY-0036)
  # and the apps that need the network.
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch: # manual checks; dispatched runs post a commit status

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The harness of the tests, at the commit that the tests read here.
      - id: lib
        uses: flakeyard/lib-actions@db9e3be2b6be4383c465ed6a0f996c1cf7870d1e # v0.1.0
      # Needs bash and jq, which the runner has; the stub of gh answers
      # every call, so no token is used.
      - env:
          SHELL_LIB: ${{ steps.lib.outputs.path }}
        run: tests/run.sh

  check:
    needs: [unit] # every other job of the workflow
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@1343fcb9ba9f013a0b633ffc1c8f81e0d082d309 # v0.6.0
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      flake: .
      expect-checks: '["data-formats","markdown","nix","shell","text","treefmt","workflows"]'
      # Weekly, the apps that need the network: the links of the Markdown files
      # and the online audits of the workflows.
      apps: ${{ github.event_name == 'schedule' && '["markdown-links","workflows-online"]' || '[]' }}
      renovate-presets: '["flakeyard/renovate-config"]'
      # The default configurations of the atoms apply (FY-0037).
      forbid-tool-configs: true
